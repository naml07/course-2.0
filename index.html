<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NEON DRIFT v2 — Course Infinie</title>
<meta name="description" content="NEON DRIFT v2 — Jeu de course infinie synthwave. Évite les obstacles, ramasse les pièces, active les power-ups et bats ton record!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#0a0118;
  --bg-horizon:#1a0530;
  --neon-pink:#ff2e9a;
  --neon-cyan:#08f7fe;
  --neon-yellow:#fde74c;
  --neon-green:#39ff14;
  --neon-purple:#c77dff;
  --road:#0e0620;
  --text:#f4f2ff;
  --text-dim:#8b7fad;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;
  background:var(--bg-deep);
  color:var(--text);
  font-family:'Orbitron','Segoe UI',Arial,sans-serif;
  overflow:hidden;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}
#wrap{
  position:relative;width:100%;height:100vh;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 0%,var(--bg-horizon) 0%,var(--bg-deep) 60%);
}
#stage{
  position:relative;
  width:min(480px,100vw);height:100vh;max-height:920px;
  overflow:hidden;
  border-left:2px solid rgba(255,46,154,0.2);
  border-right:2px solid rgba(8,247,254,0.2);
}
canvas{display:block;width:100%;height:100%;background:var(--road)}

/* ── HUD ── */
#hud{
  position:absolute;top:0;left:0;right:0;
  padding:14px 16px 0;
  display:flex;justify-content:space-between;align-items:flex-start;
  pointer-events:none;z-index:5;
}
.hud-item{
  background:rgba(10,1,24,0.55);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(8,247,254,0.15);
  border-radius:10px;padding:8px 12px;
  min-width:70px;text-align:center;
}
.hud-label{
  font-size:9px;font-weight:700;letter-spacing:2.5px;
  color:var(--neon-cyan);
  text-shadow:0 0 6px rgba(8,247,254,0.5);
  display:block;margin-bottom:2px;
}
.hud-val{
  font-size:20px;font-weight:900;
  color:var(--text);
  text-shadow:0 0 8px rgba(255,255,255,0.3);
}
.hud-sub{font-size:10px;color:var(--neon-yellow);margin-top:2px;letter-spacing:1px}
#hud-best{border-color:rgba(255,46,154,0.2)}
#hud-best .hud-label{color:var(--neon-pink);text-shadow:0 0 6px rgba(255,46,154,0.5)}
#hud-best .hud-val{color:var(--neon-pink)}

/* ── Combo ── */
#combo{
  position:absolute;top:28%;left:0;right:0;
  text-align:center;font-size:42px;font-weight:900;
  letter-spacing:4px;pointer-events:none;z-index:6;
  opacity:0;transition:opacity 0.3s ease,transform 0.3s ease;
  transform:scale(0.7);
}
#combo.show{opacity:1;transform:scale(1)}
#combo.c2{color:var(--neon-green);text-shadow:0 0 20px rgba(57,255,20,0.7)}
#combo.c3{color:var(--neon-yellow);text-shadow:0 0 20px rgba(253,231,76,0.7)}
#combo.c4{color:var(--neon-pink);text-shadow:0 0 25px rgba(255,46,154,0.8);animation:comboPulse 0.5s infinite}
@keyframes comboPulse{
  0%,100%{transform:scale(1)}50%{transform:scale(1.12)}
}

/* ── Power-up indicators ── */
#powerups{
  position:absolute;top:78px;left:14px;
  display:flex;flex-direction:column;gap:6px;
  z-index:5;pointer-events:none;
}
.pu-icon{
  font-size:11px;font-weight:700;
  padding:5px 10px;
  background:rgba(10,1,24,0.6);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border-radius:8px;display:none;
  letter-spacing:1px;
}
.pu-icon.active{display:flex;align-items:center;gap:6px}
#pu-shield{border:1px solid rgba(8,247,254,0.4);color:var(--neon-cyan)}
#pu-magnet{border:1px solid rgba(199,125,255,0.4);color:var(--neon-purple)}

/* ── Notification banner ── */
#notification{
  position:absolute;top:20%;left:0;right:0;
  text-align:center;font-size:15px;font-weight:700;
  letter-spacing:3px;pointer-events:none;z-index:7;
  opacity:0;transform:translateY(-10px);
  transition:opacity 0.3s ease,transform 0.3s ease;
}
#notification.show{opacity:1;transform:translateY(0)}

/* ── Level up ── */
#levelUp{
  position:absolute;top:36%;left:0;right:0;
  text-align:center;font-size:24px;font-weight:900;
  letter-spacing:4px;color:var(--neon-yellow);
  text-shadow:0 0 16px rgba(253,231,76,0.85);
  opacity:0;pointer-events:none;z-index:6;
  transition:opacity 0.3s ease,transform 0.3s ease;
  transform:translateY(10px) scale(0.9);
}
#levelUp.show{opacity:1;transform:translateY(0) scale(1)}

/* ── Screens ── */
.screen-overlay{
  position:absolute;inset:0;z-index:10;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;gap:14px;padding:24px;
  background:
    repeating-linear-gradient(0deg,rgba(255,46,154,0.04) 0px,rgba(255,46,154,0.04) 1px,transparent 1px,transparent 32px),
    repeating-linear-gradient(90deg,rgba(8,247,254,0.04) 0px,rgba(8,247,254,0.04) 1px,transparent 1px,transparent 32px),
    rgba(10,1,24,0.92);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.logo{
  font-size:clamp(32px,9vw,50px);
  font-weight:900;letter-spacing:6px;line-height:1.05;
  background:linear-gradient(170deg,var(--neon-cyan) 20%,var(--neon-pink) 80%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(255,46,154,0.5));
  animation:glitchLogo 4s infinite;
}
@keyframes glitchLogo{
  0%,6%,100%{transform:translate(0);filter:drop-shadow(0 0 22px rgba(255,46,154,0.5))}
  2%{transform:translate(-3px,1px);filter:drop-shadow(0 0 22px rgba(8,247,254,0.6)) hue-rotate(40deg)}
  4%{transform:translate(3px,-1px);filter:drop-shadow(0 0 22px rgba(255,46,154,0.5))}
  40%,46%{transform:translate(0)}
  42%{transform:translate(2px,-2px);filter:drop-shadow(0 0 18px rgba(8,247,254,0.7)) hue-rotate(60deg)}
  44%{transform:translate(-2px,2px);filter:drop-shadow(0 0 22px rgba(255,46,154,0.5))}
}
.version{
  font-size:10px;letter-spacing:4px;color:var(--neon-purple);
  border:1px solid rgba(199,125,255,0.3);
  padding:3px 12px;border-radius:20px;
}
.sub{
  font-size:11px;letter-spacing:2px;
  color:var(--text-dim);max-width:300px;line-height:1.7;
}
.btn{
  margin-top:10px;padding:14px 38px;
  font-family:inherit;font-size:14px;font-weight:900;letter-spacing:4px;
  color:var(--bg-deep);background:var(--neon-yellow);
  border:none;border-radius:6px;cursor:pointer;
  box-shadow:0 0 24px rgba(253,231,76,0.5),inset 0 -3px 0 rgba(0,0,0,0.15);
  transition:transform 0.1s ease,box-shadow 0.2s ease;
}
.btn:hover{box-shadow:0 0 36px rgba(253,231,76,0.7),inset 0 -3px 0 rgba(0,0,0,0.15)}
.btn:active{transform:scale(0.95)}

/* ── Game Over specifics ── */
#gameover-screen{display:none}
.go-logo{
  font-size:clamp(24px,7vw,34px);
  background:linear-gradient(170deg,#ff4444 20%,var(--neon-pink) 80%);
  -webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 0 18px rgba(255,46,46,0.6));
}
.new-best{
  font-size:13px;font-weight:900;letter-spacing:3px;
  color:var(--neon-yellow);
  text-shadow:0 0 14px rgba(253,231,76,0.7);
  display:none;
}
.new-best.show{display:block;animation:fadeInUp 0.5s ease both}
.stats{
  width:100%;max-width:260px;
  display:flex;flex-direction:column;gap:2px;
  margin:6px 0;
}
.stat-row{
  display:flex;justify-content:space-between;
  padding:8px 14px;
  background:rgba(255,255,255,0.03);
  border-radius:6px;
  opacity:0;animation:fadeInUp 0.4s ease forwards;
}
.stat-row:nth-child(1){animation-delay:0.1s}
.stat-row:nth-child(2){animation-delay:0.25s}
.stat-row:nth-child(3){animation-delay:0.4s}
.stat-row:nth-child(4){animation-delay:0.55s}
@keyframes fadeInUp{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
.stat-label{font-size:10px;letter-spacing:2px;color:var(--text-dim)}
.stat-val{font-size:14px;font-weight:900;color:var(--neon-cyan)}

/* ── Controls ── */
#controls{
  position:absolute;bottom:22px;left:0;right:0;
  display:flex;justify-content:space-between;
  padding:0 20px;z-index:5;
}
.pad{
  width:70px;height:70px;border-radius:50%;
  background:rgba(255,255,255,0.04);
  border:2px solid var(--neon-cyan);
  color:var(--neon-cyan);font-size:24px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 12px rgba(8,247,254,0.25);
  -webkit-tap-highlight-color:transparent;
  transition:background 0.1s ease;
}
.pad:active{background:rgba(8,247,254,0.2)}
.pad.fly{
  border-color:var(--neon-yellow);color:var(--neon-yellow);
  box-shadow:0 0 12px rgba(253,231,76,0.25);
  font-size:11px;letter-spacing:1px;font-weight:900;
}
.pad.fly.ready{animation:pulseReady 1.2s infinite}
.pad.fly.cooling{opacity:0.35}
@keyframes pulseReady{
  0%,100%{box-shadow:0 0 12px rgba(253,231,76,0.25)}
  50%{box-shadow:0 0 28px rgba(253,231,76,0.75)}
}

/* ── Screen flash ── */
#screen-flash{
  position:absolute;inset:0;z-index:8;
  pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 70%,rgba(255,46,46,0.5),rgba(255,46,46,0.1));
  transition:opacity 0.08s ease;
}
#screen-flash.active{opacity:1}

@media(min-width:700px){
  #controls{display:none}
  .sub::after{content:" Flèches ← → pour bouger, ↑ pour voler."}
}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" aria-label="Zone de jeu NEON DRIFT"></canvas>

    <header id="hud">
      <div class="hud-item" id="hud-score">
        <span class="hud-label">SCORE</span>
        <span class="hud-val" id="score">0</span>
      </div>
      <div class="hud-item" id="hud-level">
        <span class="hud-label">NIVEAU</span>
        <span class="hud-val" id="level">1</span>
        <span class="hud-sub">🪙 <span id="coins">0</span></span>
      </div>
      <div class="hud-item" id="hud-best">
        <span class="hud-label">RECORD</span>
        <span class="hud-val" id="bestScore">0</span>
      </div>
    </header>

    <div id="powerups" aria-live="polite">
      <div class="pu-icon" id="pu-shield">🛡 BOUCLIER</div>
      <div class="pu-icon" id="pu-magnet">🧲 AIMANT <span id="magnet-timer"></span></div>
    </div>

    <div id="combo" aria-live="polite"></div>
    <div id="levelUp" aria-live="polite"></div>
    <div id="notification" aria-live="polite"></div>
    <div id="screen-flash"></div>

    <div id="title-screen" class="screen-overlay">
      <div class="logo">NEON<br>DRIFT</div>
      <div class="version">v2.0 — PREMIUM</div>
      <div class="sub">Évite les obstacles, ramasse les pièces et active les power-ups pour battre ton record.</div>
      <button class="btn" id="startBtn" type="button">DÉMARRER</button>
      <div style="font-size:9px;color:var(--text-dim);letter-spacing:1.5px;margin-top:8px">
        TOTAL 🪙 <span id="totalCoinsTitle">0</span>
      </div>
    </div>

    <div id="gameover-screen" class="screen-overlay" style="display:none">
      <div class="logo go-logo">COLLISION</div>
      <div class="new-best" id="newBest">🏆 NOUVEAU RECORD !</div>
      <div class="stats" id="stats-container">
        <div class="stat-row">
          <span class="stat-label">DISTANCE</span>
          <span class="stat-val" id="finalScore">0 m</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">PIÈCES</span>
          <span class="stat-val" id="finalCoins">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">COMBO MAX</span>
          <span class="stat-val" id="finalCombo">×1</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">NIVEAU</span>
          <span class="stat-val" id="finalLevel">1</span>
        </div>
      </div>
      <button class="btn" id="retryBtn" type="button">REJOUER</button>
    </div>

    <nav id="controls" aria-label="Contrôles de jeu">
      <button class="pad" id="leftPad" type="button" aria-label="Gauche">◀</button>
      <button class="pad fly ready" id="flyPad" type="button" aria-label="Vol">VOL</button>
      <button class="pad" id="rightPad" type="button" aria-label="Droite">▶</button>
    </nav>
  </div>
</div>

<script>
(function(){
'use strict';

/* ══════════════════════════════════
   CONFIG
   ══════════════════════════════════ */
const CFG = {
  LANES: 3,
  MARGIN_PCT: 0.08,
  BASE_SPEED: 5.5,
  MAX_SPEED: 21,
  FLY_DUR: 2.0,
  FLY_CD: 7,
  MAGNET_DUR: 6,
  MAGNET_RADIUS: 155,
  MAX_PARTICLES: 130,
  STAR_COUNT: 65,
  COMBO_THRESH: [0, 3, 6, 10],
  PU_SPAWN_MIN: 16,
  PU_SPAWN_MAX: 28,
};

/* ══════════════════════════════════
   STATE
   ══════════════════════════════════ */
let state = 'title';
let player = null;
let obstacles = [], coins = [], powerUps = [], particles = [];
let stars = [];
let dashOff = 0, score = 0, speed = 5.5, spawnT = 0, coinT = 1, puT = 20, elapsed = 0;
let level = 1, coinCount = 0, maxCombo = 1, lvlUpT = 0, notifT = 0;
let combo = { count:0, mult:1, displayT:0 };
let shield = { active:false };
let magnet = { active:false, timer:0 };
let fly    = { active:false, timer:0, cd:0 };
let shake = 0, flashT = 0;
let gameTime = 0; // global time for animations

/* ══════════════════════════════════
   CANVAS & SIZING
   ══════════════════════════════════ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
let W, H;

function resize(){
  W = stage.clientWidth;
  H = stage.clientHeight;
  canvas.width = W;
  canvas.height = H;
  if(stars.length) repositionStars();
}
resize();
window.addEventListener('resize', resize);

const MARGIN = () => W * CFG.MARGIN_PCT;
const laneW  = () => (W - MARGIN()*2) / CFG.LANES;
const laneX  = (i) => MARGIN() + laneW()*i + laneW()/2;

/* ══════════════════════════════════
   PERSISTENCE
   ══════════════════════════════════ */
let bestScore = 0, totalCoins = 0;

function loadSave(){
  try{
    bestScore  = parseInt(localStorage.getItem('nd2_best'))  || 0;
    totalCoins = parseInt(localStorage.getItem('nd2_coins')) || 0;
  }catch(e){/* silencieux */}
  document.getElementById('bestScore').textContent = bestScore;
  document.getElementById('totalCoinsTitle').textContent = totalCoins;
}
function savePersist(){
  try{
    localStorage.setItem('nd2_best',  bestScore);
    localStorage.setItem('nd2_coins', totalCoins);
  }catch(e){/* silencieux */}
}
loadSave();


/* ══════════════════════════════════
   STARS
   ══════════════════════════════════ */
function createStars(){
  stars = [];
  const hH = H * 0.16;
  for(let i = 0; i < CFG.STAR_COUNT; i++){
    stars.push({
      x: Math.random() * W,
      y: Math.random() * hH,
      sz: 0.4 + Math.random() * 1.4,
      a: 0.3 + Math.random() * 0.7,
      spd: 1 + Math.random() * 3,
      ph: Math.random() * Math.PI * 2,
    });
  }
}
function repositionStars(){
  const hH = H * 0.16;
  for(const s of stars){ s.x = Math.random()*W; s.y = Math.random()*hH; }
}
createStars();

/* ══════════════════════════════════
   PARTICLES
   ══════════════════════════════════ */
function emitP(x,y,vx,vy,col,life,sz){
  if(!particles) return;
  if(particles.length >= CFG.MAX_PARTICLES) particles.shift();
  particles.push({x,y,vx,vy,col,life,maxL:life,sz});
}
function emitBurst(x,y,n,col,spd,life,sz){
  for(let i=0;i<n;i++){
    const a = (Math.PI*2/n)*i + (Math.random()-0.5)*0.5;
    const s = spd*(0.4+Math.random()*0.6);
    emitP(x,y,Math.cos(a)*s,Math.sin(a)*s,col,life*(0.7+Math.random()*0.3),sz);
  }
}

/* ══════════════════════════════════
   HELPERS
   ══════════════════════════════════ */
const palette = ['#ff2e9a','#08f7fe','#fde74c','#7cf78a','#c9b8ff','#ff6b6b','#4ecdc4'];
function carCol(seed){ return palette[seed % palette.length]; }

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function rectsOvlp(a,b){
  return Math.abs(a.x-b.x) < (a.w+b.w)/2*0.7 &&
         Math.abs((a.y+a.h/2)-(b.y+b.h/2)) < (a.h+b.h)/2*0.7;
}
function circRectOvlp(c,r){
  const cx = Math.max(r.x-r.w/2, Math.min(c.x, r.x+r.w/2));
  const cy = Math.max(r.y, Math.min(c.y, r.y+r.h));
  const dx=c.x-cx, dy=c.y-cy;
  return dx*dx+dy*dy < c.r*c.r;
}

/* ══════════════════════════════════
   SPAWNS
   ══════════════════════════════════ */
function spawnObstacle(){
  const lane = Math.floor(Math.random()*CFG.LANES);
  const roll = Math.random();
  let type='car', w, h, sMult=1;

  if(roll < 0.12 && level >= 3){
    type='truck'; w=laneW()*0.62; h=laneW()*1.35; sMult=0.72;
  } else if(roll < 0.28 && level >= 2){
    type='moto'; w=laneW()*0.26; h=laneW()*0.62; sMult=1.35;
  } else {
    w=laneW()*0.5; h=laneW()*0.9;
  }
  obstacles.push({
    lane, x:laneX(lane), y:-h-15, w, h, type, sMult,
    color:carCol(Math.floor(Math.random()*7)),
    trail:[]
  });
}
function spawnCoin(){
  const lane = Math.floor(Math.random()*CFG.LANES);
  const r = laneW()*0.17;
  coins.push({lane, x:laneX(lane), y:-r*2-12, r, spin:0});
}
function spawnPowerUp(){
  const lane = Math.floor(Math.random()*CFG.LANES);
  const sz = laneW()*0.22;
  const type = (!shield.active && Math.random()<0.55) ? 'shield' : 'magnet';
  powerUps.push({lane, x:laneX(lane), y:-sz*2-12, sz, type, angle:0});
}

/* ══════════════════════════════════
   GAME STATE
   ══════════════════════════════════ */
function resetGame(){
  const lw = laneW();
  player = {
    lane:1, x:laneX(1), targetX:laneX(1),
    y:0, w:lw*0.5, h:lw*0.9,
  };
  player.y = H - player.h - 34;

  obstacles=[]; coins=[]; powerUps=[]; particles=[];
  dashOff=0; score=0; speed=CFG.BASE_SPEED;
  spawnT=0; coinT=1; puT = CFG.PU_SPAWN_MIN + Math.random()*5;
  elapsed=0; level=1; coinCount=0; maxCombo=1;
  lvlUpT=0; notifT=0;
  combo={count:0, mult:1, displayT:0};
  shield={active:false};
  magnet={active:false, timer:0};
  fly={active:false, timer:0, cd:0};
  shake=0; flashT=0;

  document.getElementById('level').textContent='1';
  document.getElementById('coins').textContent='0';
  document.getElementById('pu-shield').classList.remove('active');
  document.getElementById('pu-magnet').classList.remove('active');
  document.getElementById('combo').className='';
  updateFlyBtn();
}

function startGame(){
  resetGame();
  state='playing';
  document.getElementById('title-screen').style.display='none';
  document.getElementById('gameover-screen').style.display='none';
  document.getElementById('levelUp').classList.remove('show');
  document.getElementById('notification').classList.remove('show');
  document.getElementById('newBest').classList.remove('show');
}

function endGame(){
  state='gameover';
  shake=1;
  flashT=0.35;
  document.getElementById('screen-flash').classList.add('active');

  // Vibrate on mobile
  try{ if(navigator.vibrate) navigator.vibrate([100,30,60]); }catch(e){}

  // Collision particles
  emitBurst(player.x, player.y+player.h/2, 24, '#ff4444', 5, 0.8, 3.5);
  emitBurst(player.x, player.y+player.h/2, 12, '#fff', 3, 0.5, 2);

  const isNewBest = Math.floor(score) > bestScore;
  if(isNewBest) bestScore = Math.floor(score);
  totalCoins += coinCount;
  savePersist();

  document.getElementById('bestScore').textContent = bestScore;
  document.getElementById('finalScore').textContent = Math.floor(score)+' m';
  document.getElementById('finalCoins').textContent = coinCount;
  document.getElementById('finalCombo').textContent = '×'+maxCombo;
  document.getElementById('finalLevel').textContent = level;
  document.getElementById('totalCoinsTitle').textContent = totalCoins;

  if(isNewBest) document.getElementById('newBest').classList.add('show');
  else document.getElementById('newBest').classList.remove('show');

  // Re-trigger stat animations
  const rows = document.querySelectorAll('.stat-row');
  rows.forEach(r => { r.style.animation='none'; r.offsetHeight; r.style.animation=''; });

  setTimeout(()=>{
    document.getElementById('gameover-screen').style.display='flex';
  }, 350);
}

function triggerFly(){

  fly.active=true; fly.timer=CFG.FLY_DUR; fly.cd=CFG.FLY_CD;
}

function updateFlyBtn(){

    el.classList.remove('ready'); el.classList.add('cooling');

}

function activateShield(){

}
function breakShield(){

function activateMagnet(){

/* ══════════════════════════════════
   COMBO
   ══════════════════════════════════ */
function addCombo(){
  combo.count++;
  let m = 1;
  for(let i = CFG.COMBO_THRESH.length-1; i>=0; i--){
    if(combo.count >= CFG.COMBO_THRESH[i]){ m=i+1; break; }
  }
  combo.mult = Math.min(4, m);
  if(combo.mult > maxCombo) maxCombo = combo.mult;
  combo.displayT = 1.5;
  updateComboUI();
}
function resetCombo(){
  combo.count=0; combo.mult=1; combo.displayT=0;
  updateComboUI();
}
function updateComboUI(){
  const el = document.getElementById('combo');
  if(combo.mult > 1){
    el.textContent = '×'+combo.mult;
    el.className = 'show c'+combo.mult;
  } else {
    el.className = '';
  }
}

   MOVE
   ══════════════════════════════════ */
function movePlayer(dir){
  if(state!=='playing') return;
  player.lane = Math.max(0, Math.min(CFG.LANES-1, player.lane+dir));
  player.targetX = laneX(player.lane);
}

/* ══════════════════════════════════
   INPUT — Keyboard

window.addEventListener('keydown', e => {
  if(e.key==='ArrowLeft')  movePlayer(-1);
  if(e.key==='ArrowRight') movePlayer(1);
  if(e.key==='ArrowUp')    triggerFly();

});

/* ── Touch pads ── */
function bindPad(id,dir){
  const el = document.getElementById(id);
  const fire = ev => { ev.preventDefault(); movePlayer(dir); };
  el.addEventListener('touchstart', fire, {passive:false});
  el.addEventListener('mousedown', fire);
}
bindPad('leftPad',-1);
bindPad('rightPad',1);

const flyEl = document.getElementById('flyPad');
const fireFly = ev => { ev.preventDefault(); triggerFly(); };
flyEl.addEventListener('touchstart', fireFly, {passive:false});
flyEl.addEventListener('mousedown', fireFly);

/* ── Swipe ── */
let swSx=0, swSy=0, swId=-1;
stage.addEventListener('touchstart', e => {
  if(e.target.closest('#controls') || e.target.closest('.btn')) return;
  swSx = e.touches[0].clientX;
  swSy = e.touches[0].clientY;
  swId = e.touches[0].identifier;
}, {passive:true});
stage.addEventListener('touchend', e => {
  const t = Array.from(e.changedTouches).find(t=>t.identifier===swId);
  if(!t) return;
  const dx = t.clientX - swSx, dy = t.clientY - swSy;
  if(Math.abs(dx)>35 && Math.abs(dx)>Math.abs(dy)){
    movePlayer(dx>0?1:-1);
  } else if(dy<-35 && Math.abs(dy)>Math.abs(dx)){
    triggerFly();
  }
  swId=-1;
}, {passive:true});

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', startGame);

/* ══════════════════════════════════
   UPDATE
   ══════════════════════════════════ */
function checkLevel(){
  const nl = Math.floor(score/250)+1;
  if(nl!==level){
    level=nl;
    document.getElementById('level').textContent=level;
    const el = document.getElementById('levelUp');
    el.textContent='NIVEAU '+level;
    el.classList.add('show');
    lvlUpT=1.5;
    emitBurst(W/2, H*0.4, 10, '#fde74c', 3, 0.7, 2);
  }
}

function update(dt){
  if(state!=='playing') return;
  elapsed+=dt;

  // Speed
  speed = CFG.BASE_SPEED + elapsed*0.085 + (level-1)*0.32;
  if(speed>CFG.MAX_SPEED) speed=CFG.MAX_SPEED;

  // Score
  score += speed*dt*0.6;
  document.getElementById('score').textContent = Math.floor(score);
  checkLevel();

  // Level up timer
  if(lvlUpT>0){ lvlUpT-=dt; if(lvlUpT<=0) document.getElementById('levelUp').classList.remove('show'); }
  // Notif timer
  if(notifT>0){ notifT-=dt; if(notifT<=0) document.getElementById('notification').classList.remove('show'); }
  // Combo display timer
  if(combo.displayT>0){ combo.displayT-=dt; if(combo.displayT<=0 && combo.mult<=1) updateComboUI(); }

  // Player move
  player.x += (player.targetX - player.x) * 0.18;
  dashOff += speed*dt*20;

  // Fly
  if(fly.active){ fly.timer-=dt; if(fly.timer<=0) fly.active=false; }
  if(fly.cd>0){ fly.cd-=dt; if(fly.cd<0) fly.cd=0; }
  updateFlyBtn();

  // Magnet
  if(magnet.active){
    magnet.timer-=dt;
    document.getElementById('magnet-timer').textContent = Math.ceil(magnet.timer)+'s';
    if(magnet.timer<=0){
      magnet.active=false;
      document.getElementById('pu-magnet').classList.remove('active');
    }
  }

  // Flash
  if(flashT>0){
    flashT-=dt;
    if(flashT<=0) document.getElementById('screen-flash').classList.remove('active');
  }

  // ── Spawn obstacles ──
  spawnT-=dt;
  const rate = Math.max(0.42, 1.25 - elapsed*0.009);
  if(spawnT<=0){ spawnObstacle(); spawnT=rate; }

  // ── Spawn coins ──
  coinT-=dt;
  if(coinT<=0){ spawnCoin(); coinT=1.4+Math.random()*1.0; }

  // ── Spawn power-ups ──
  puT-=dt;
  if(puT<=0){
    spawnPowerUp();
    puT = CFG.PU_SPAWN_MIN + Math.random()*(CFG.PU_SPAWN_MAX-CFG.PU_SPAWN_MIN);
  }

  // ── Update obstacles ──
  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i];
    const mv = speed*dt*20*o.sMult;
    o.y += mv;

    // Light trail
    if(o.trail.length > 6) o.trail.shift();
    o.trail.push({x:o.x, y:o.y, a:1});

    if(o.y > H+60){ obstacles.splice(i,1); continue; }

    if(!fly.active && rectsOvlp(player,o)){
      if(shield.active){
        breakShield();
        obstacles.splice(i,1);
        resetCombo();
      } else {
        endGame();
        return;
      }
    }
  }

  // ── Update coins ──
  for(let i=coins.length-1;i>=0;i--){
    const c=coins[i];
    c.y += speed*dt*20;
    c.spin = (c.spin||0) + dt*3.5;

    // Magnet attraction
    if(magnet.active){
      const dx = player.x - c.x;
      const dy = (player.y+player.h/2) - c.y;
      const dist = Math.sqrt(dx*dx+dy*dy);
      if(dist < CFG.MAGNET_RADIUS && dist > 1){
        const force = (1 - dist/CFG.MAGNET_RADIUS) * 350 * dt;
        c.x += (dx/dist)*force;
        c.y += (dy/dist)*force;
      }
    }

    if(c.y > H+50){ coins.splice(i,1); resetCombo(); continue; }

    if(circRectOvlp({x:c.x,y:c.y,r:c.r}, player)){
      coins.splice(i,1);
      coinCount++;
      addCombo();
      score += 20 * combo.mult;
      document.getElementById('coins').textContent = coinCount;
      emitBurst(c.x, c.y, 8, '#fde74c', 3, 0.5, 2);
    }
  }

  // ── Update power-ups ──
  for(let i=powerUps.length-1;i>=0;i--){
    const pu=powerUps[i];
    pu.y += speed*dt*20;
    pu.angle += dt*2.5;
    if(pu.y > H+50){ powerUps.splice(i,1); continue; }

    if(circRectOvlp({x:pu.x,y:pu.y,r:pu.sz}, player)){
      powerUps.splice(i,1);
      if(pu.type==='shield') activateShield();
      else activateMagnet();
      emitBurst(pu.x, pu.y, 12, pu.type==='shield'?'#08f7fe':'#c77dff', 4, 0.6, 2.5);
    }
  }

  // ── Update particles ──
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x += p.vx*dt*60;
    p.y += p.vy*dt*60;
    p.life -= dt;
    if(p.life<=0) particles.splice(i,1);
  }

  // ── Player trail ──
  if(Math.random()<0.5){
    const trailCol = fly.active ? '#fde74c' : '#08f7fe';
    emitP(
      player.x + (Math.random()-0.5)*player.w*0.4,
      player.y + player.h + 2,
      (Math.random()-0.5)*0.5,
      1.5 + Math.random(),
      trailCol,
      0.3 + Math.random()*0.25,
      1 + Math.random()*1.5
    );
  }
}

/* ══════════════════════════════════
   DRAW
   ══════════════════════════════════ */
function drawStars(){
  const hH = H*0.16;
  for(const s of stars){
    const tw = 0.25 + 0.75*Math.abs(Math.sin(gameTime*s.spd+s.ph));
    ctx.globalAlpha = s.a*tw;
    ctx.fillStyle='#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.sz, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawRoad(){
  const hH = H*0.16;

  // Sky
  const skyG = ctx.createLinearGradient(0,0,0,hH);
  skyG.addColorStop(0,'#0d0422');
  skyG.addColorStop(1,'#2a0940');
  ctx.fillStyle=skyG;
  ctx.fillRect(0,0,W,hH);

  // Stars
  drawStars();

  // Sun halo (pulsing)
  const sunCx=W/2, sunCy=hH*0.92, sunR=hH*0.85;
  const haloS = 1 + 0.07*Math.sin(gameTime*2);
  const haloG = ctx.createRadialGradient(sunCx,sunCy,sunR*0.7,sunCx,sunCy,sunR*1.5*haloS);
  haloG.addColorStop(0,'rgba(255,46,154,0.2)');
  haloG.addColorStop(0.6,'rgba(255,46,154,0.06)');
  haloG.addColorStop(1,'rgba(255,46,154,0)');
  ctx.fillStyle=haloG;
  ctx.beginPath();ctx.arc(sunCx,sunCy,sunR*1.5*haloS,0,Math.PI*2);ctx.fill();

  // Sun body
  ctx.save();
  ctx.beginPath();ctx.rect(0,0,W,hH);ctx.clip();
  const sunG = ctx.createLinearGradient(0,sunCy-sunR,0,sunCy+sunR);
  sunG.addColorStop(0,'#fde74c');
  sunG.addColorStop(0.5,'#ff2e9a');
  sunG.addColorStop(1,'#5a1470');
  ctx.fillStyle=sunG;
  ctx.beginPath();ctx.arc(sunCx,sunCy,sunR,0,Math.PI*2);ctx.fill();

  // Scanlines on sun (animated)
  ctx.fillStyle='#0d0422';
  for(let i=0;i<6;i++){
    const yy = sunCy - sunR*0.58 + i*sunR*0.24;
    const thick = sunR*0.05 + Math.sin(gameTime*1.2+i*0.8)*sunR*0.008;
    ctx.fillRect(sunCx-sunR,yy,sunR*2,thick);
  }
  ctx.restore();

  // Road surface
  const roadG = ctx.createLinearGradient(0,hH,0,H);
  roadG.addColorStop(0,'#14082c');
  roadG.addColorStop(1,'#0a0418');
  ctx.fillStyle=roadG;
  ctx.fillRect(0,hH,W,H-hH);

  // Perspective grid
  ctx.strokeStyle='rgba(255,46,154,0.2)';
  ctx.lineWidth=1;
  for(let i=1;i<=8;i++){
    const t=i/8;
    const yy=hH+(H-hH)*t*t*0.4;
    ctx.globalAlpha=0.4-t*0.35;
    ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(W,yy);ctx.stroke();
  }
  ctx.globalAlpha=1;

  // Subtle road reflection
  const refG = ctx.createLinearGradient(0,hH,0,hH+80);
  refG.addColorStop(0,'rgba(255,46,154,0.06)');
  refG.addColorStop(1,'rgba(255,46,154,0)');
  ctx.fillStyle=refG;
  ctx.fillRect(0,hH,W,80);

  // Side neon rails
  const m = MARGIN();
  ctx.lineWidth=3;

  // Left rail — pink
  ctx.strokeStyle='rgba(255,46,154,0.65)';
  ctx.shadowColor='#ff2e9a';
  ctx.shadowBlur=14 + 4*Math.sin(gameTime*3);
  ctx.beginPath();ctx.moveTo(m,hH);ctx.lineTo(m,H);ctx.stroke();

  // Right rail — cyan
  ctx.strokeStyle='rgba(8,247,254,0.65)';
  ctx.shadowColor='#08f7fe';
  ctx.shadowBlur=14 + 4*Math.sin(gameTime*3+1);
  ctx.beginPath();ctx.moveTo(W-m,hH);ctx.lineTo(W-m,H);ctx.stroke();
  ctx.shadowBlur=0;

  // Lane dashes
  ctx.strokeStyle='rgba(253,231,76,0.45)';
  ctx.lineWidth=3;
  ctx.setLineDash([24,20]);
  for(let i=1;i<CFG.LANES;i++){
    const x = m + laneW()*i;
    ctx.lineDashOffset=-dashOff;
    ctx.beginPath();ctx.moveTo(x,hH);ctx.lineTo(x,H);ctx.stroke();
  }
  ctx.setLineDash([]);

  // Speed streaks
  if(state==='playing' && speed>9){
    const inten = Math.min(1, (speed-9)/10);
    ctx.lineWidth=2;
    for(let i=0;i<7;i++){
      const sx = m*0.45 + Math.random()*m*0.4;
      const side = i%2===0 ? sx : W-sx;
      const ly = ((dashOff*1.4)+i*130)%(H-hH)+hH;
      const len = 30+40*inten;
      ctx.strokeStyle='rgba(244,242,255,'+(0.12*inten)+')';
      ctx.beginPath();ctx.moveTo(side,ly);ctx.lineTo(side,ly+len);
      ctx.stroke();
    }
  }
}

/* ── Draw car (for obstacles) ── */
function drawCar(cx,y,w,h,bodyCol){
  ctx.save();
  ctx.translate(cx,y);

  // Underglow
  const ugG = ctx.createRadialGradient(0,h*0.5,0,0,h*0.5,w*0.9);
  ugG.addColorStop(0,'rgba('+hexToRgb(bodyCol)+',0.12)');
  ugG.addColorStop(1,'rgba('+hexToRgb(bodyCol)+',0)');
  ctx.fillStyle=ugG;
  ctx.fillRect(-w*0.9,-h*0.05,w*1.8,h*1.1);

  // Wheels
  ctx.fillStyle='#08040f';
  const wW=w*0.15, wH=h*0.22;
  roundRect(-w/2-wW*0.3,h*0.12,wW,wH,wW*0.35);ctx.fill();
  roundRect(w/2-wW*0.7,h*0.12,wW,wH,wW*0.35);ctx.fill();
  roundRect(-w/2-wW*0.3,h*0.62,wW,wH,wW*0.35);ctx.fill();
  roundRect(w/2-wW*0.7,h*0.62,wW,wH,wW*0.35);ctx.fill();

  // Body
  ctx.shadowColor=bodyCol; ctx.shadowBlur=10;
  ctx.fillStyle=bodyCol;
  roundRect(-w/2,0,w,h,w*0.22);ctx.fill();

  // Stripe
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,0.14)';
  roundRect(-w*0.07,h*0.02,w*0.14,h*0.96,w*0.05);ctx.fill();

  // Windshield
  ctx.fillStyle='rgba(10,1,24,0.75)';
  roundRect(-w*0.28,h*0.13,w*0.56,h*0.24,w*0.15);ctx.fill();

  // Rear window
  ctx.fillStyle='rgba(10,1,24,0.6)';
  roundRect(-w*0.22,h*0.62,w*0.44,h*0.16,w*0.08);ctx.fill();

  // Headlights
  ctx.shadowBlur=7;ctx.fillStyle='#fff8d6';ctx.shadowColor='#fff8d6';
  ctx.beginPath();ctx.arc(-w*0.3,h*0.055,w*0.05,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(w*0.3,h*0.055,w*0.05,0,Math.PI*2);ctx.fill();

  // Taillights
  ctx.fillStyle='#ff2e2e';ctx.shadowColor='#ff2e2e';
  ctx.beginPath();ctx.arc(-w*0.3,h*0.945,w*0.045,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(w*0.3,h*0.945,w*0.045,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;

  ctx.restore();
}

/* ── Draw obstacle with trail ── */
function drawObstacle(o){
  // Light trail
  if(o.trail.length > 1){
    ctx.strokeStyle = o.color;
    ctx.lineWidth = o.type==='moto' ? 1.5 : 2.5;
    ctx.globalAlpha = 0.15;
    for(let i=1;i<o.trail.length;i++){
      const t = o.trail[i];
      ctx.globalAlpha = 0.04 * i;
      ctx.beginPath();
      ctx.moveTo(t.x-o.w*0.3, t.y+o.h);
      ctx.lineTo(t.x-o.w*0.3, t.y+o.h+12);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(t.x+o.w*0.3, t.y+o.h);
      ctx.lineTo(t.x+o.w*0.3, t.y+o.h+12);
      ctx.stroke();
    }
    ctx.globalAlpha=1;
  }

  if(o.type==='truck') drawTruck(o.x,o.y,o.w,o.h,o.color);
  else if(o.type==='moto') drawMoto(o.x,o.y,o.w,o.h,o.color);
  else drawCar(o.x,o.y,o.w,o.h,o.color);
}

/* ── Draw player car (enhanced) ── */
function drawPlayerCar(cx,y,w,h,isFlying){
  ctx.save();
  ctx.translate(cx,y);

  // Enhanced underglow
  const ugG = ctx.createRadialGradient(0,h*0.5,0,0,h*0.5,w*1.1);
  const ugCol = isFlying ? 'rgba(253,231,76,' : 'rgba(8,247,254,';
  ugG.addColorStop(0,ugCol+'0.22)');
  ugG.addColorStop(1,ugCol+'0)');
  ctx.fillStyle=ugG;
  ctx.fillRect(-w*1.1,-h*0.1,w*2.2,h*1.2);

  // Wheels
  ctx.fillStyle='#08040f';
  const wW=w*0.16,wH=h*0.24;
  roundRect(-w/2-wW*0.35,h*0.12,wW,wH,wW*0.4);ctx.fill();
  roundRect(w/2-wW*0.65,h*0.12,wW,wH,wW*0.4);ctx.fill();
  roundRect(-w/2-wW*0.35,h*0.62,wW,wH,wW*0.4);ctx.fill();
  roundRect(w/2-wW*0.65,h*0.62,wW,wH,wW*0.4);ctx.fill();

  // Body
  const pCol = isFlying ? '#fde74c' : '#08f7fe';
  ctx.shadowColor=pCol;ctx.shadowBlur=22;
  ctx.fillStyle=pCol;
  roundRect(-w/2,0,w,h,w*0.24);ctx.fill();

  // Accent stripe
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,0.2)';
  roundRect(-w*0.08,h*0.02,w*0.16,h*0.96,w*0.05);ctx.fill();

  // Side accents
  ctx.fillStyle='rgba(255,255,255,0.1)';
  roundRect(-w/2+w*0.04,h*0.35,w*0.08,h*0.3,w*0.03);ctx.fill();
  roundRect(w/2-w*0.12,h*0.35,w*0.08,h*0.3,w*0.03);ctx.fill();

  // Windshield
  ctx.fillStyle='rgba(10,1,24,0.8)';
  roundRect(-w*0.28,h*0.13,w*0.56,h*0.26,w*0.12);ctx.fill();
  // Windshield shine
  ctx.fillStyle='rgba(255,255,255,0.08)';
  roundRect(-w*0.22,h*0.15,w*0.2,h*0.08,w*0.04);ctx.fill();

  // Rear window
  ctx.fillStyle='rgba(10,1,24,0.65)';
  roundRect(-w*0.24,h*0.62,w*0.48,h*0.18,w*0.1);ctx.fill();

  // Headlights (brighter)
  ctx.shadowBlur=10;ctx.fillStyle='#fffde0';ctx.shadowColor='#fffde0';
  ctx.beginPath();ctx.arc(-w*0.32,h*0.055,w*0.06,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(w*0.32,h*0.055,w*0.06,0,Math.PI*2);ctx.fill();

  // Taillights with glow
  ctx.fillStyle='#ff3838';ctx.shadowColor='#ff3838';ctx.shadowBlur=8;
  ctx.beginPath();ctx.arc(-w*0.32,h*0.94,w*0.055,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(w*0.32,h*0.94,w*0.055,0,Math.PI*2);ctx.fill();

  // Engine glow at rear
  ctx.shadowBlur=12;
  ctx.fillStyle = isFlying ? 'rgba(253,231,76,0.6)' : 'rgba(8,247,254,0.5)';
  ctx.shadowColor = isFlying ? '#fde74c' : '#08f7fe';
  ctx.beginPath();ctx.arc(0,h*1.02,w*0.12,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;

  ctx.restore();
}

/* ── Draw coin (enhanced) ── */
function drawCoin(c){
  const sx = Math.max(0.15, Math.abs(Math.cos(c.spin||0)));
  ctx.save();
  ctx.translate(c.x,c.y);
  ctx.scale(sx,1);

  // Outer glow
  ctx.shadowColor='#fde74c';ctx.shadowBlur=18;
  ctx.fillStyle='#fde74c';
  ctx.beginPath();ctx.arc(0,0,c.r,0,Math.PI*2);ctx.fill();

  // Inner ring
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(10,1,24,0.5)';
  ctx.lineWidth=Math.max(1.5,c.r*0.16);
  ctx.beginPath();ctx.arc(0,0,c.r*0.6,0,Math.PI*2);ctx.stroke();

  // Sparkle highlight
  const sparkle = 0.5+0.5*Math.sin(gameTime*5+c.spin*2);
  ctx.fillStyle='rgba(255,255,255,'+sparkle*0.5+')';
  ctx.beginPath();ctx.arc(-c.r*0.2,-c.r*0.2,c.r*0.18,0,Math.PI*2);ctx.fill();

  ctx.restore();
}

/* ── Draw power-up ── */
function drawPU(pu){
  ctx.save();
  ctx.translate(pu.x,pu.y);
  ctx.rotate(pu.angle);

  const s=pu.sz;
  const col = pu.type==='shield' ? '#08f7fe' : '#c77dff';

  // Glow
  ctx.shadowColor=col;ctx.shadowBlur=22;

  // Diamond shape
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.moveTo(0,-s);ctx.lineTo(s,0);ctx.lineTo(0,s);ctx.lineTo(-s,0);
  ctx.closePath();ctx.fill();

  // Inner icon
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(10,1,24,0.6)';
  ctx.beginPath();
  const is=s*0.5;
  ctx.moveTo(0,-is);ctx.lineTo(is,0);ctx.lineTo(0,is);ctx.lineTo(-is,0);
  ctx.closePath();ctx.fill();

  // Letter
  ctx.fillStyle='#fff';
  ctx.font='bold '+Math.floor(s*0.55)+'px Orbitron,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(pu.type==='shield'?'S':'M',0,1);

  ctx.restore();
}

/* ── Draw shield effect ── */
function drawShieldFX(){
  if(!shield.active) return;
  ctx.save();
  const cx=player.x, cy=player.y+player.h/2;
  const r = Math.max(player.w,player.h)*0.7;

  ctx.translate(cx,cy);
  ctx.rotate(gameTime*1.8);

  ctx.strokeStyle='rgba(8,247,254,0.45)';
  ctx.lineWidth=2;
  ctx.shadowColor='#08f7fe';
  ctx.shadowBlur=12;

  // Hexagon
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a=(Math.PI*2/6)*i;
    const x=Math.cos(a)*r, y=Math.sin(a)*r;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.closePath();ctx.stroke();

  // Inner hex
  ctx.globalAlpha=0.2;
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a=(Math.PI*2/6)*i+Math.PI/6;
    const x=Math.cos(a)*r*0.65, y=Math.sin(a)*r*0.65;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.closePath();ctx.stroke();
  ctx.globalAlpha=1;
  ctx.shadowBlur=0;

  ctx.restore();
}

/* ── Draw magnet attraction lines ── */
function drawMagnetFX(){
  if(!magnet.active) return;
  ctx.save();
  ctx.strokeStyle='rgba(199,125,255,0.25)';
  ctx.lineWidth=1;
  ctx.setLineDash([3,7]);
  ctx.lineDashOffset = -gameTime*80;

  for(const c of coins){
    const dx=player.x-c.x, dy=(player.y+player.h/2)-c.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist < CFG.MAGNET_RADIUS){
      ctx.globalAlpha = 0.4*(1-dist/CFG.MAGNET_RADIUS);
      ctx.beginPath();
      ctx.moveTo(c.x,c.y);
      ctx.lineTo(player.x,player.y+player.h/2);
      ctx.stroke();
    }
  }
  ctx.setLineDash([]);ctx.globalAlpha=1;
  ctx.restore();
}

/* ── Draw particles ── */
function drawParticles(){
  for(const p of particles){
    const a = p.life/p.maxL;
    ctx.globalAlpha=a;
    ctx.fillStyle=p.col;
    ctx.shadowColor=p.col;
    ctx.shadowBlur=4;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.sz*a,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;
}

/* ── Hex to RGB helper ── */
function hexToRgb(hex){
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  return r+','+g+','+b;
}

/* ══════════════════════════════════
   MAIN DRAW
   ══════════════════════════════════ */
function draw(){
  ctx.save();

  // Screen shake
  if(shake>0){
    const mag=shake*12;
    ctx.translate((Math.random()-0.5)*mag,(Math.random()-0.5)*mag);
  }

  drawRoad();
  if(state==='title'){ ctx.restore(); return; }

  // Power-ups on road
  for(const pu of powerUps) drawPU(pu);

  // Coins
  for(const c of coins) drawCoin(c);

  // Magnet lines
  drawMagnetFX();

  // Obstacles
  for(const o of obstacles) drawObstacle(o);

  // Player
  if(player){
    if(fly.active){
      const prog = (CFG.FLY_DUR - fly.timer)/CFG.FLY_DUR;
      let lift;
      if(prog<0.2) lift=prog/0.2;
      else if(prog<0.8) lift=1;
      else lift=1-(prog-0.8)/0.2;
      const rise = lift*player.h*0.85;
      const scale = 1 + lift*0.22;

      // Ground shadow
      ctx.save();
      ctx.fillStyle='rgba(0,0,0,'+(0.35-lift*0.2)+')';
      ctx.beginPath();
      ctx.ellipse(player.x,player.y+player.h*0.9,player.w*(0.45-lift*0.15),player.h*(0.14-lift*0.05),0,0,Math.PI*2);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.translate(player.x,player.y-rise);
      ctx.scale(scale,scale);
      ctx.translate(-player.x,-(player.y-rise));
      drawPlayerCar(player.x,player.y-rise,player.w,player.h,true);
      ctx.restore();
    } else {
      drawPlayerCar(player.x,player.y,player.w,player.h,false);
    }

    // Shield visual
    drawShieldFX();
  }

  // Particles (on top)
  drawParticles();

  ctx.restore();
}

/* ══════════════════════════════════
   GAME LOOP
   ══════════════════════════════════ */
let last = performance.now();

function loop(now){
  const dt = Math.min(0.033, (now-last)/1000);
  last = now;
  gameTime += dt;

  if(shake>0) shake = Math.max(0, shake-dt*2.8);
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
